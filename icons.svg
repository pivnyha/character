<svg xmlns="http://www.w3.org/2000/svg" style="display:none;">
    <defs>
        <!-- ХАРАКТЕРИСТИКИ -->
        <symbol id="i-strength" viewBox="0 0 24 24">
            <rect x="4" y="10" width="16" height="4" fill="currentColor"/>
            <rect x="6" y="6" width="4" height="12" fill="currentColor"/>
            <rect x="14" y="6" width="4" height="12" fill="currentColor"/>
        </symbol>
        <symbol id="i-luck" viewBox="0 0 24 24">
            <rect x="4" y="4" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"/>
            <rect x="8" y="8" width="3" height="3" fill="currentColor"/>
            <rect x="13" y="13" width="3" height="3" fill="currentColor"/>
        </symbol>
        <symbol id="i-attention" viewBox="0 0 24 24">
            <rect x="3" y="7" width="18" height="10" fill="none" stroke="currentColor" stroke-width="2"/>
            <rect x="10" y="10" width="4" height="4" fill="currentColor"/>
        </symbol>
        <symbol id="i-agility" viewBox="0 0 24 24">
            <polygon points="13,3 5,14 11,14 9,21 19,10 13,10" fill="currentColor"/>
        </symbol>
        <symbol id="i-charisma" viewBox="0 0 24 24">
            <rect x="8" y="3" width="8" height="8" fill="currentColor"/>
            <rect x="4" y="13" width="16" height="8" fill="currentColor"/>
        </symbol>

        <!-- НАВЫКИ -->
        <symbol id="i-shooting" viewBox="0 0 24 24">
            <rect x="11" y="2" width="2" height="6" fill="currentColor"/>
            <rect x="11" y="16" width="2" height="6" fill="currentColor"/>
            <rect x="2" y="11" width="6" height="2" fill="currentColor"/>
            <rect x="16" y="11" width="6" height="2" fill="currentColor"/>
            <rect x="9" y="9" width="6" height="6" fill="none" stroke="currentColor" stroke-width="1.5"/>
        </symbol>
        <symbol id="i-melee" viewBox="0 0 24 24">
            <rect x="6" y="8" width="12" height="4" fill="currentColor"/>
            <rect x="8" y="12" width="8" height="8" fill="currentColor"/>
        </symbol>
        <symbol id="i-fencing" viewBox="0 0 24 24">
            <rect x="4" y="4" width="3" height="16" transform="rotate(45 5.5 12)" fill="currentColor"/>
            <rect x="17" y="4" width="3" height="16" transform="rotate(-45 18.5 12)" fill="currentColor"/>
        </symbol>
        <symbol id="i-heavy" viewBox="0 0 24 24">
            <rect x="9" y="3" width="6" height="10" fill="currentColor"/>
            <rect x="11" y="13" width="2" height="8" fill="currentColor"/>
            <rect x="6" y="17" width="12" height="2" fill="currentColor"/>
        </symbol>
        <symbol id="i-hack" viewBox="0 0 24 24">
            <rect x="5" y="5" width="10" height="10" fill="none" stroke="currentColor" stroke-width="2"/>
            <rect x="15" y="15" width="6" height="2" fill="currentColor"/>
            <rect x="15" y="18" width="2" height="2" fill="currentColor"/>
        </symbol>
        <symbol id="i-craft" viewBox="0 0 24 24">
            <rect x="6" y="6" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2"/>
            <rect x="10" y="10" width="4" height="4" fill="currentColor"/>
        </symbol>
        <symbol id="i-repair" viewBox="0 0 24 24">
            <rect x="9" y="12" width="6" height="9" fill="currentColor"/>
            <rect x="6" y="4" width="12" height="8" fill="currentColor"/>
        </symbol>
        <symbol id="i-medicine" viewBox="0 0 24 24">
            <rect x="10" y="3" width="4" height="18" fill="currentColor"/>
            <rect x="3" y="10" width="18" height="4" fill="currentColor"/>
        </symbol>
        <symbol id="i-diagnose" viewBox="0 0 24 24">
            <rect x="4" y="4" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2"/>
            <rect x="14" y="14" width="7" height="3" transform="rotate(45 17 15)" fill="currentColor"/>
        </symbol>
        <symbol id="i-driving" viewBox="0 0 24 24">
            <rect x="3" y="9" width="18" height="6" fill="none" stroke="currentColor" stroke-width="2"/>
            <rect x="10" y="9" width="4" height="6" fill="currentColor"/>
        </symbol>
        <symbol id="i-intellect" viewBox="0 0 24 24">
            <rect x="4" y="4" width="6" height="6" fill="currentColor"/>
            <rect x="14" y="4" width="6" height="6" fill="currentColor"/>
            <rect x="4" y="14" width="6" height="6" fill="currentColor"/>
            <rect x="14" y="14" width="6" height="6" fill="currentColor"/>
        </symbol>

        <!-- ПЕРКИ -->
        <symbol id="i-charm" viewBox="0 0 24 24">
            <rect x="8" y="4" width="8" height="6" fill="currentColor"/>
            <rect x="6" y="10" width="12" height="8" fill="currentColor"/>
        </symbol>
        <symbol id="i-shield" viewBox="0 0 24 24">
            <path d="M12 2 L20 6 L20 14 L12 22 L4 14 L4 6 Z" fill="none" stroke="currentColor" stroke-width="2"/>
        </symbol>
        <symbol id="i-trade" viewBox="0 0 24 24">
            <rect x="4" y="10" width="16" height="4" fill="currentColor"/>
            <rect x="6" y="6" width="4" height="4" fill="currentColor"/>
            <rect x="14" y="14" width="4" height="4" fill="currentColor"/>
        </symbol>
        <symbol id="i-chem" viewBox="0 0 24 24">
            <rect x="9" y="3" width="6" height="3" fill="currentColor"/>
            <rect x="8" y="6" width="8" height="15" fill="none" stroke="currentColor" stroke-width="2"/>
            <rect x="10" y="13" width="4" height="6" fill="currentColor"/>
        </symbol>
        <symbol id="i-voice" viewBox="0 0 24 24">
            <rect x="4" y="9" width="6" height="6" fill="currentColor"/>
            <rect x="12" y="11" width="4" height="2" fill="currentColor"/>
            <rect x="14" y="8" width="2" height="8" fill="currentColor"/>
            <rect x="18" y="6" width="2" height="12" fill="currentColor"/>
        </symbol>

        <!-- ИНТЕРФЕЙС -->
        <symbol id="i-stats" viewBox="0 0 24 24">
            <rect x="4" y="3" width="16" height="18" fill="none" stroke="currentColor" stroke-width="2"/>
            <rect x="8" y="8" width="8" height="2" fill="currentColor"/>
            <rect x="8" y="12" width="8" height="2" fill="currentColor"/>
            <rect x="8" y="16" width="5" height="2" fill="currentColor"/>
        </symbol>
        <symbol id="i-skills" viewBox="0 0 24 24">
            <rect x="3" y="3" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"/>
            <rect x="8" y="8" width="8" height="8" fill="none" stroke="currentColor" stroke-width="2"/>
            <rect x="11" y="11" width="2" height="2" fill="currentColor"/>
        </symbol>
        <symbol id="i-perks" viewBox="0 0 24 24">
            <rect x="8" y="3" width="8" height="8" fill="currentColor"/>
            <rect x="9" y="11" width="6" height="10" fill="currentColor"/>
        </symbol>
        <symbol id="i-picked" viewBox="0 0 24 24">
            <polygon points="13,3 5,14 11,14 9,21 19,10 13,10" fill="currentColor"/>
        </symbol>
        <symbol id="i-done" viewBox="0 0 24 24">
            <polyline points="4,12 10,18 20,6" fill="none" stroke="currentColor" stroke-width="3"/>
        </symbol>
        <symbol id="i-copy" viewBox="0 0 24 24">
            <rect x="8" y="8" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2"/>
            <rect x="4" y="4" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2"/>
        </symbol>
        <symbol id="i-close" viewBox="0 0 24 24">
            <line x1="6" y1="6" x2="18" y2="18" stroke="currentColor" stroke-width="2.5"/>
            <line x1="18" y1="6" x2="6" y2="18" stroke="currentColor" stroke-width="2.5"/>
        </symbol>
        <symbol id="i-remove" viewBox="0 0 24 24">
            <line x1="6" y1="6" x2="18" y2="18" stroke="currentColor" stroke-width="2.5"/>
            <line x1="18" y1="6" x2="6" y2="18" stroke="currentColor" stroke-width="2.5"/>
        </symbol>
        <symbol id="i-plus" viewBox="0 0 24 24">
            <line x1="12" y1="4" x2="12" y2="20" stroke="currentColor" stroke-width="2.5"/>
            <line x1="4" y1="12" x2="20" y2="12" stroke="currentColor" stroke-width="2.5"/>
        </symbol>
        <symbol id="i-minus" viewBox="0 0 24 24">
            <line x1="4" y1="12" x2="20" y2="12" stroke="currentColor" stroke-width="2.5"/>
        </symbol>
        <symbol id="i-logo" viewBox="0 0 24 24">
            <rect x="3" y="3" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"/>
            <rect x="9" y="9" width="6" height="6" fill="currentColor"/>
        </symbol>
        <symbol id="i-music-on" viewBox="0 0 24 24">
            <rect x="4" y="9" width="6" height="6" fill="currentColor"/>
            <rect x="12" y="11" width="4" height="2" fill="currentColor"/>
            <rect x="14" y="8" width="2" height="8" fill="currentColor"/>
            <rect x="18" y="6" width="2" height="12" fill="currentColor"/>
        </symbol>
        <symbol id="i-music-off" viewBox="0 0 24 24">
            <rect x="4" y="9" width="6" height="6" fill="currentColor"/>
            <line x1="14" y1="8" x2="20" y2="16" stroke="currentColor" stroke-width="2.5"/>
            <line x1="20" y1="8" x2="14" y2="16" stroke="currentColor" stroke-width="2.5"/>
        </symbol>
    </defs>
</svg>
