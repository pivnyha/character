<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Редактор персонажа</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">
                <span class="logo-icon">⚔</span>
                <span class="logo-text">TAPKOV</span>
            </div>
            <div class="header-right">
                <div class="points-display">
                    <span class="points-label">ОЧКИ</span>
                    <span class="points-value" id="totalPoints">2</span>
                </div>
                <div class="status-led"></div>
            </div>
        </header>

        <nav class="tabs">
            <button class="tab-btn active" data-tab="characteristics">
                <span class="tab-icon">📋</span> ХАРАКТЕРИСТИКИ
            </button>
            <button class="tab-btn" data-tab="skills">
                <span class="tab-icon">🎯</span> НАВЫКИ
            </button>
            <button class="tab-btn" data-tab="perks">
                <span class="tab-icon">🏅</span> ПЕРКИ
            </button>
        </nav>

        <!-- Вкладка: Характеристики -->
        <section id="characteristics" class="tab-content active">
            <div class="tab-header">
                <div class="tab-title">📋 ХАРАКТЕРИСТИКИ</div>
                <div class="tab-stats">
                    <span class="stat-badge">MIN -4</span>
                    <span class="stat-badge">MAX +4</span>
                    <span class="stat-badge highlight" id="charPointsDisplay">ОЧКОВ: 2</span>
                </div>
            </div>
            <div class="stats-grid" id="characteristicsGrid"></div>
        </section>

        <!-- Вкладка: Навыки -->
        <section id="skills" class="tab-content">
            <div class="tab-header">
                <div class="tab-title">🎯 НАВЫКИ</div>
                <div class="tab-stats">
                    <span class="stat-badge" id="selectedSkillsDisplay">ВЫБРАНО: 0/4</span>
                    <span class="stat-badge highlight" id="skillPointsDisplay">ОЧКОВ: 3</span>
                </div>
            </div>
            
            <!-- Список ВСЕХ навыков для выбора -->
            <div class="skills-selection">
                <h3 class="selection-title">ВЫБЕРИТЕ 4 НАВЫКА</h3>
                <div class="skills-grid" id="allSkillsGrid"></div>
            </div>

            <!-- Выбранные навыки (всегда на одном месте) -->
            <div class="selected-skills-section">
                <h3 class="selection-title">ВЫБРАННЫЕ НАВЫКИ</h3>
                <div class="selected-skills-grid" id="selectedSkillsGrid">
                    <div class="empty-message">Выберите навыки выше</div>
                </div>
            </div>
        </section>

        <!-- Вкладка: Перки -->
        <section id="perks" class="tab-content">
            <div class="tab-header">
                <div class="tab-title">🏅 ПЕРКИ</div>
                <div class="tab-stats">
                    <span class="stat-badge highlight" id="perkPointsDisplay">ОЧКОВ ПЕРКОВ: 3</span>
                </div>
            </div>
            <div class="perks-container">
                <div class="perks-grid" id="perksGrid"></div>
            </div>
        </section>

        <footer class="actions">
            <button id="resetBtn" class="btn btn-danger">⏻ СБРОС</button>
            <button id="doneBtn" class="btn btn-success">✅ ГОТОВО</button>
        </footer>

        <div id="savedMessage" class="message hidden">✔ ПЕРСОНАЖ СОХРАНЕН</div>
    </div>

    <div id="resultModal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h2>📜 ХАРАКТЕРИСТИКИ ПЕРСОНАЖА</h2>
                <button class="modal-close" id="closeModalBtn">✕</button>
            </div>
            <div class="modal-body" id="resultBody"></div>
            <div class="modal-footer">
                <button id="copyBtn" class="btn btn-primary">📋 КОПИРОВАТЬ</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
