<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Редактор персонажа</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;700&family=Roboto+Condensed:wght@400;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
</head>
<body>
    <!-- ИКОНКА НАСТРОЕК -->
    <div class="settings-toggle" id="settingsToggle" title="Настройки звука">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
    </div>

    <!-- ПАНЕЛЬ НАСТРОЕК -->
    <div class="settings-panel hidden" id="settingsPanel">
        <div class="settings-title">ГРОМКОСТЬ ЗВУКОВ</div>
        <input type="range" id="volumeSlider" min="0" max="1" step="0.1" value="0.3">
        <div class="settings-value" id="volumeValue">30%</div>
    </div>

    <div class="container">
        <header>
            <div class="logo">
                <span class="logo-text">[ ⚔ ] РЕДАКТОР ПЕРСОНАЖА</span>
            </div>
            <div class="header-right">
                <div class="status-led"></div>
            </div>
        </header>

        <nav class="tabs">
            <button class="tab-btn active" data-tab="characteristics">ХАРАКТЕРИСТИКИ</button>
            <button class="tab-btn" data-tab="skills">НАВЫКИ И ПЕРКИ</button>
        </nav>

        <section id="characteristics" class="tab-content active">
            <div class="tab-header">
                <div class="tab-title">ХАРАКТЕРИСТИКИ</div>
                <div class="tab-stats">
                    <span class="stat-badge">MIN -4</span>
                    <span class="stat-badge">MAX +4</span>
                    <span class="stat-badge highlight" id="charPointsDisplay">ОЧКОВ: 2</span>
                </div>
            </div>
            <div class="stats-grid" id="characteristicsGrid"></div>
        </section>

        <section id="skills" class="tab-content">
            <div class="tab-header">
                <div class="tab-title">НАВЫКИ И ПЕРКИ</div>
                <div class="tab-stats">
                    <span class="stat-badge" id="selectedDisplay">ВЫБРАНО: 0/4</span>
                    <span class="stat-badge highlight" id="skillPointsDisplay">ОЧКОВ: 3</span>
                </div>
            </div>

            <div class="skills-container">
                <div class="skills-layout">
                    <div class="skills-column">
                        <div class="column-title">НАВЫКИ</div>
                        <div class="skills-list" id="allSkillsList"></div>
                    </div>

                    <div class="skills-column">
                        <div class="column-title">ПЕРКИ</div>
                        <div class="skills-list" id="allPerksList"></div>
                    </div>

                    <div class="skills-column">
                        <div class="column-title">ВЫБРАННОЕ</div>
                        <div class="skills-list" id="selectedList"></div>
                    </div>
                </div>

                <div class="description-area" id="descriptionArea">
                    <div class="description-placeholder">Наведите на навык или перк для описания</div>
                    <div class="description-content" id="descriptionContent"></div>
                </div>
            </div>
        </section>

        <footer class="actions">
            <div class="action-left">
                <button id="unlimitedBtn" class="btn btn-toggle">
                    <span id="unlimitedText">ЛИМИТЫ ВКЛ</span>
                </button>
            </div>

            <div class="action-center">
                <button id="doneBtn" class="btn btn-success">
                    ГОТОВО
                </button>
            </div>

            <div class="action-right">
                <button id="randomBtn" class="btn btn-random">
                    РАНДОМ
                </button>
            </div>
        </footer>

        <div id="savedMessage" class="message hidden">✔ ПЕРСОНАЖ СОХРАНЕН</div>
    </div>

    <div id="resultModal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h2>📜 ХАРАКТЕРИСТИКИ ПЕРСОНАЖА</h2>
                <button class="modal-close" id="closeModalBtn">✕</button>
            </div>
            <div class="modal-body" id="resultBody"></div>
            <div class="modal-footer">
                <button id="copyBtn" class="btn btn-primary">
                    КОПИРОВАТЬ
                </button>
            </div>
        </div>
    </div>

    <footer class="status-bar">
        <div class="status-item">
            <span class="status-led" id="statusLed"></span>
            <span class="status-label">СТАТУС:</span>
            <span class="status-value" id="statusText">ГОТОВ</span>
        </div>
        <div class="status-divider"></div>
        <div class="status-item">
            <span class="status-label">ВЫБРАНО:</span>
            <span class="status-dots" id="statusDots">
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
            </span>
            <span class="status-value" id="statusSelected">0/4</span>
        </div>
        <div class="status-divider"></div>
        <div class="status-item">
            <span class="status-label">ОЧКОВ:</span>
            <span class="status-value highlight" id="statusPoints">2</span>
        </div>
        <div class="status-divider"></div>
        <div class="status-item">
            <span class="status-label">СЕКТОР:</span>
            <span class="status-value" id="statusSector">01</span>
        </div>
    </footer>

    <script src="script.js?v=6"></script>
</body>
</html>
