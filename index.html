<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Редактор персонажа</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">
                <span class="logo-icon">⚔</span>
                <span class="logo-text">TAPKOV</span>
            </div>
            <div class="header-right">
                <div class="status-led"></div>
            </div>
        </header>

        <nav class="tabs">
            <button class="tab-btn active" data-tab="characteristics">
                <span class="tab-icon">📋</span> ХАРАКТЕРИСТИКИ
            </button>
            <button class="tab-btn" data-tab="skills">
                <span class="tab-icon">🎯</span> НАВЫКИ И ПЕРКИ
            </button>
        </nav>

        <section id="characteristics" class="tab-content active">
            <div class="tab-header">
                <div class="tab-title">📋 ХАРАКТЕРИСТИКИ</div>
                <div class="tab-stats">
                    <span class="stat-badge">MIN -4</span>
                    <span class="stat-badge">MAX +4</span>
                    <span class="stat-badge highlight" id="charPointsDisplay">ОЧКОВ: 2</span>
                </div>
            </div>
            <div class="stats-grid" id="characteristicsGrid"></div>
        </section>

        <section id="skills" class="tab-content">
            <div class="tab-header">
                <div class="tab-title">🎯 НАВЫКИ И ПЕРКИ</div>
                <div class="tab-stats">
                    <span class="stat-badge" id="selectedDisplay">ВЫБРАНО: 0/4</span>
                    <span class="stat-badge highlight" id="skillPointsDisplay">ОЧКОВ: 3</span>
                </div>
            </div>

            <div class="skills-container">
                <div class="skills-layout">
                    <div class="skills-column">
                        <div class="column-title">📋 НАВЫКИ</div>
                        <div class="skills-list" id="allSkillsList"></div>
                    </div>

                    <div class="skills-column">
                        <div class="column-title">🏅 ПЕРКИ</div>
                        <div class="skills-list" id="allPerksList"></div>
                    </div>

                    <div class="skills-column">
                        <div class="column-title">⚡ ВЫБРАННОЕ</div>
                        <div class="skills-list" id="selectedList"></div>
                    </div>
                </div>

                <div class="description-area" id="descriptionArea">
                    <div class="description-placeholder">Наведите на навык или перк для описания</div>
                    <div class="description-content" id="descriptionContent"></div>
                </div>
            </div>
        </section>

        <footer class="actions">
            <button id="doneBtn" class="btn btn-success">✅ ГОТОВО</button>
        </footer>

        <div id="savedMessage" class="message hidden">✔ ПЕРСОНАЖ СОХРАНЕН</div>
    </div>

    <div id="resultModal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h2>📜 ХАРАКТЕРИСТИКИ ПЕРСОНАЖА</h2>
                <button class="modal-close" id="closeModalBtn">✕</button>
            </div>
            <div class="modal-body" id="resultBody"></div>
            <div class="modal-footer">
                <button id="copyBtn" class="btn btn-primary">📋 КОПИРОВАТЬ</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
