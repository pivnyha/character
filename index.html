<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4 очка</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;700&family=Roboto+Condensed:wght@400;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">
                <svg class="icon"><use href="icons.svg#i-logo"/></svg>
                <span class="logo-text">4 ОЧКА</span>
            </div>
            <div class="header-right">
                <div class="status-led"></div>
            </div>
        </header>

        <nav class="tabs">
            <button class="tab-btn active" data-tab="characteristics">
                <svg class="icon"><use href="icons.svg#i-stats"/></svg>
                ХАРАКТЕРИСТИКИ
            </button>
            <button class="tab-btn" data-tab="skills">
                <svg class="icon"><use href="icons.svg#i-skills"/></svg>
                НАВЫКИ И ПЕРКИ
            </button>
        </nav>

        <section id="characteristics" class="tab-content active">
            <div class="tab-header">
                <div class="tab-title">
                    <svg class="icon"><use href="icons.svg#i-stats"/></svg>
                    ХАРАКТЕРИСТИКИ
                </div>
                <div class="tab-stats">
                    <span class="stat-badge">MIN -4</span>
                    <span class="stat-badge">MAX +4</span>
                    <span class="stat-badge highlight" id="charPointsDisplay">ОЧКОВ: 2</span>
                </div>
            </div>
            <div class="stats-grid" id="characteristicsGrid"></div>
        </section>

        <section id="skills" class="tab-content">
            <div class="tab-header">
                <div class="tab-title">
                    <svg class="icon"><use href="icons.svg#i-skills"/></svg>
                    НАВЫКИ И ПЕРКИ
                </div>
                <div class="tab-stats">
                    <span class="stat-badge" id="selectedDisplay">ВЫБРАНО: 0/4</span>
                    <span class="stat-badge highlight" id="skillPointsDisplay">ОЧКОВ: 3</span>
                </div>
            </div>

            <div class="skills-container">
                <div class="skills-layout">
                    <div class="skills-column">
                        <div class="column-title">
                            <svg class="icon"><use href="icons.svg#i-skills"/></svg>
                            НАВЫКИ
                        </div>
                        <div class="skills-list" id="allSkillsList"></div>
                    </div>

                    <div class="skills-column">
                        <div class="column-title">
                            <svg class="icon"><use href="icons.svg#i-picked"/></svg>
                            ПЕРКИ
                        </div>
                        <div class="skills-list" id="allPerksList"></div>
                    </div>

                    <div class="skills-column">
                        <div class="column-title">
                            <svg class="icon"><use href="icons.svg#i-done"/></svg>
                            ВЫБРАННОЕ
                        </div>
                        <div class="skills-list" id="selectedList"></div>
                    </div>
                </div>

                <div class="description-area" id="descriptionArea">
                    <div class="description-placeholder">Наведите на навык или перк для описания</div>
                    <div class="description-content" id="descriptionContent"></div>
                </div>
            </div>
        </section>

        <!-- ===== НИЖНЯЯ ПАНЕЛЬ ===== -->
        <footer class="actions">
            <!-- ЛЕВО: Тумблер -->
            <div class="action-left">
                <label class="hardware-toggle" title="Безлимитный режим">
                    <input type="checkbox" id="unlimitedToggle">
                    <div class="hw-base">
                        <div class="hw-nut"></div>
                        <div class="hw-lever"></div>
                        <div class="hw-plate">ON / OFF</div>
                    </div>
                    <span class="toggle-label">БЕЗ ЛИМИТОВ</span>
                </label>
            </div>

            <!-- ЦЕНТР: Кнопка Готово -->
            <div class="action-center">
                <button id="doneBtn" class="btn btn-success">
                    <svg class="icon"><use href="icons.svg#i-done"/></svg>
                    ГОТОВО
                </button>
            </div>

            <!-- ПРАВО: Рандом -->
            <div class="action-right">
                <button id="randomBtn" class="btn btn-random">
                    <svg class="icon"><use href="icons.svg#i-luck"/></svg>
                    РАНДОМ
                </button>
            </div>
        </footer>

        <div id="savedMessage" class="message hidden">✔ ПЕРСОНАЖ СОХРАНЕН</div>
    </div>

    <div id="resultModal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h2>📜 ХАРАКТЕРИСТИКИ ПЕРСОНАЖА</h2>
                <button class="modal-close" id="closeModalBtn">
                    <svg class="icon"><use href="icons.svg#i-close"/></svg>
                </button>
            </div>
            <div class="modal-body" id="resultBody"></div>
            <div class="modal-footer">
                <button id="copyBtn" class="btn btn-primary">
                    <svg class="icon"><use href="icons.svg#i-copy"/></svg>
                    КОПИРОВАТЬ
                </button>
            </div>
        </div>
    </div>

    <!-- ===== СТАТУС-БАР ===== -->
    <footer class="status-bar">
        <div class="status-item">
            <span class="status-led" id="statusLed"></span>
            <span class="status-label">СТАТУС:</span>
            <span class="status-value" id="statusText">ГОТОВ</span>
        </div>
        <div class="status-divider"></div>
        <div class="status-item">
            <span class="status-label">ВЫБРАНО:</span>
            <span class="status-dots" id="statusDots">
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
            </span>
            <span class="status-value" id="statusSelected">0/4</span>
        </div>
        <div class="status-divider"></div>
        <div class="status-item">
            <span class="status-label">ОЧКОВ:</span>
            <span class="status-value highlight" id="statusPoints">2</span>
        </div>
        <div class="status-divider"></div>
        <div class="status-item">
            <span class="status-label">СЕКТОР:</span>
            <span class="status-value" id="statusSector">01</span>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
